name: CI

# Runs on every push and pull request. The evaluation report is uploaded as
# an artifact on every run, so a reviewer can read the metrics for any commit
# rather than trusting a number quoted in a README.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The Firestore emulator requires a JDK, and firebase-tools dropped
      # support for versions below 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rules tests against the emulator
        run: pnpm test:rules

  evaluation:
    name: Evaluation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails the build when the guarded orchestrator violates a safety
      # property. The baseline arm is expected to fail and does not gate.
      - name: Run the evaluation suite
        run: pnpm eval -- --json

      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-${{ github.sha }}
          path: |
            eval/out/report.md
            eval/out/report.json
          retention-days: 30

      - name: Publish the report to the job summary
        if: always()
        run: cat eval/out/report.md >> "$GITHUB_STEP_SUMMARY"
